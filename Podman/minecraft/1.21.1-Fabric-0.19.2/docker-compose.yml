services:
  mc:
    image: docker.io/itzg/minecraft-server:latest
    container_name: mc-fabric-server
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.1"
      FABRIC_LOADER_VERSION: "0.19.2"
      JAVA_VERSION: "jdk-25.0.3+9"
      MEMORY: "8G"
      TZ: "Asia/Shanghai"
      ENABLE_WHITELIST: "TRUE"
      ONLINE_MODE: "FALSE"
    volumes:
      - ./data:/data:Z
